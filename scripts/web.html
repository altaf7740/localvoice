<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalVoice</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --accent: #c2410c; --accent-text: #ffffff; --playing: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --text: #ecebe6; --muted: #9a9890; --line: #33322e;
      --accent: #f97316; --accent-text: #161614; --playing: #2e2a1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  textarea {
    width: 100%; min-height: 140px; resize: vertical; padding: 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; margin-top: 14px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  select, input[type=range] { font: inherit; }
  select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .val { color: var(--text); font-variant-numeric: tabular-nums; }
  .buttons { display: flex; gap: 8px; margin-left: auto; }
  button {
    font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: 0.5; cursor: default; }
  .samples { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .samples button { font-weight: 400; font-size: 13px; padding: 4px 10px; border-radius: 999px; }
  #status { margin: 18px 0 8px; color: var(--muted); min-height: 1.5em; }
  #status.error { color: #dc2626; }
  ol { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  li { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  li.playing { background: var(--playing); }
  .orig { color: var(--muted); font-size: 13px; }
  .prep { font-size: 17px; margin: 2px 0 6px; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; align-items: center; }
  .stats a { color: var(--accent); }
  .stats button { font-size: 12px; padding: 2px 10px; font-weight: 500; }
  .slow { color: #dc2626; }
</style>
</head>
<body>
<main>
  <h1>LocalVoice</h1>
  <p class="sub">Type Hinglish, hear it. Runs on this machine: transliteration, then VoxCPM2.</p>

  <div class="panel">
    <div class="samples" id="samples"></div>
    <textarea id="text" placeholder="Kal ki meeting mein timeline discuss karni hai.">Kal ki meeting mein timeline discuss karni hai. Main abhi busy hoon, baad mein call karta hoon.</textarea>
    <div class="controls">
      <label>Voice <select id="voice"></select></label>
      <label>Speed <span class="val" id="speedVal"></span><input type="range" id="speed" min="0.5" max="2" step="0.05"></label>
      <label>Steps <span class="val" id="stepsVal"></span><input type="range" id="steps" min="2" max="10" step="1"></label>
      <div class="buttons">
        <button id="stop" disabled>Stop</button>
        <button id="speak" class="primary">Speak</button>
      </div>
    </div>
  </div>

  <div id="status"></div>
  <ol id="results"></ol>
</main>

<script>
const SAMPLES = [
  "Kal ki meeting mein timeline discuss karni hai.",
  "Main abhi busy hoon, baad mein call karta hoon.",
  "Server restart karna padega, deployment fail ho gaya.",
  "Tell me kya plan hai weekend ka?",
];
const $ = (id) => document.getElementById(id);
const LEAD = 0.02;    // seconds between a chunk arriving and it playing, so it isn't clipped
let sampleRate = 24000;
let run = 0;          // bumped on every Speak/Stop so stale work drops out
let ctx = null;       // AudioContext, created on the first click (browsers require a gesture)
let sources = [];     // scheduled chunks, so Stop can silence them
let timers = [];      // sentence highlight timers
let controller = null;

function setStatus(text, error = false) {
  $("status").textContent = text;
  $("status").className = error ? "error" : "";
}

function settings() {
  return { voice: $("voice").value, speed: +$("speed").value, steps: +$("steps").value };
}

function syncLabels() {
  $("speedVal").textContent = (+$("speed").value).toFixed(2) + "×";
  $("stepsVal").textContent = $("steps").value;
}

async function post(path, body, signal) {
  const resp = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal });
  if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).error || resp.statusText);
  return resp;
}

// one JSON object per line, as the server writes them
async function* messages(resp) {
  const reader = resp.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      yield JSON.parse(buf.slice(0, i));
      buf = buf.slice(i + 1);
    }
  }
  if (buf.trim()) yield JSON.parse(buf);
}

function decodePcm(b64) {
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  return Float32Array.from(new Int16Array(bytes.buffer), (v) => v / 32768);
}

function audioContext() {
  if (!ctx) ctx = new AudioContext({ sampleRate });
  ctx.resume();
  return ctx;
}

function schedule(samples, at) {
  const buffer = ctx.createBuffer(1, samples.length, sampleRate);
  buffer.copyToChannel(samples, 0);
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.connect(ctx.destination);
  src.start(at);
  sources.push(src);
}

function highlight(li, from, to) {
  const now = ctx.currentTime;
  timers.push(setTimeout(() => li.classList.add("playing"), Math.max(0, from - now) * 1000));
  timers.push(setTimeout(() => li.classList.remove("playing"), Math.max(0, to - now) * 1000));
}

function concat(parts) {
  const out = new Float32Array(parts.reduce((n, p) => n + p.length, 0));
  let i = 0;
  for (const p of parts) { out.set(p, i); i += p.length; }
  return out;
}

function toWav(samples) {
  const view = new DataView(new ArrayBuffer(44 + samples.length * 2));
  const str = (o, s) => [...s].forEach((c, i) => view.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); view.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVEfmt ");
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true); str(36, "data");
  view.setUint32(40, samples.length * 2, true);
  samples.forEach((v, i) => view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 32767, true));
  return new Blob([view], { type: "audio/wav" });
}

function addStat(el, text, cls) {
  const span = document.createElement("span");
  span.textContent = text;
  if (cls) span.className = cls;
  el.appendChild(span);
}

async function speak() {
  const text = $("text").value.trim();
  if (!text) return;
  stop();
  const myRun = ++run;
  const ac = audioContext();
  controller = new AbortController();
  const opts = settings();
  const started = performance.now();
  $("results").replaceChildren();
  $("speak").disabled = true;
  $("stop").disabled = false;
  try {
    const { sentences } = await (await post("/api/prepare", { ...opts, text }, controller.signal)).json();
    const items = sentences.map((s) => {
      const li = document.createElement("li");
      const orig = document.createElement("div"); orig.className = "orig"; orig.textContent = s.original;
      const prep = document.createElement("div"); prep.className = "prep"; prep.textContent = s.prepared;
      const stats = document.createElement("div"); stats.className = "stats";
      li.append(orig, prep, stats);
      $("results").appendChild(li);
      return { ...s, li, stats };
    });

    // each chunk is queued right after the one before it, so playback starts with the first chunk
    // while the rest of the sentence (and the next sentences) are still being generated
    let cursor = 0;       // AudioContext time where the next chunk goes
    let firstAudio = null;
    for (const [i, item] of items.entries()) {
      setStatus(`Speaking ${i + 1}/${items.length}…`);
      const resp = await post("/api/speak", { ...opts, text: item.prepared }, controller.signal);
      const parts = [];
      let gaps = 0, from = null;
      for await (const msg of messages(resp)) {
        if (myRun !== run) return;
        if (msg.error) throw new Error(msg.error);
        if (msg.stats) {
          const st = msg.stats;
          addStat(item.stats, `first chunk ${st.first_chunk.toFixed(2)}s`);
          addStat(item.stats, `synth ${st.synth.toFixed(2)}s`);
          addStat(item.stats, `audio ${st.audio.toFixed(2)}s`);
          if (st.rtf != null) addStat(item.stats, `RTF ${st.rtf.toFixed(2)}`, st.rtf > 1 ? "slow" : "");
          continue;
        }
        const samples = decodePcm(msg.audio);
        if (cursor < ac.currentTime + LEAD) {
          if (firstAudio !== null) gaps++;  // the speaker ran dry waiting for this chunk
          cursor = ac.currentTime + LEAD;
        }
        firstAudio ??= (performance.now() - started) / 1000;
        from ??= cursor;
        schedule(samples, cursor);
        cursor += samples.length / sampleRate;
        parts.push(samples);
      }
      if (from === null) continue;
      highlight(item.li, from, cursor);
      if (gaps) addStat(item.stats, `${gaps} gap${gaps > 1 ? "s" : ""}`, "slow");
      const audio = concat(parts);
      const replay = document.createElement("button"); replay.textContent = "▶ Replay";
      replay.onclick = () => {
        stop();
        const at = audioContext().currentTime + LEAD;
        schedule(audio, at);
        highlight(item.li, at, at + audio.length / sampleRate);
      };
      const dl = document.createElement("a"); dl.href = URL.createObjectURL(toWav(audio));
      dl.download = `localvoice-${i + 1}.wav`; dl.textContent = "Download";
      item.stats.append(replay, dl);
    }
    if (firstAudio === null) return setStatus("Nothing to say.");
    setStatus(`First audio after ${firstAudio.toFixed(2)}s. Playing…`);
    await new Promise((r) => timers.push(setTimeout(r, Math.max(0, cursor - ac.currentTime) * 1000)));
    if (myRun === run) setStatus(`Done. First audio after ${firstAudio.toFixed(2)}s, total ${((performance.now() - started) / 1000).toFixed(2)}s.`);
  } catch (e) {
    if (myRun === run) setStatus(`Error: ${e.message}. Is the server still running?`, true);
  } finally {
    if (myRun === run) { $("speak").disabled = false; $("stop").disabled = true; }
  }
}

function stop() {
  run++;
  controller?.abort();  // the server stops generating when the request goes away
  for (const src of sources) src.stop();
  sources = [];
  timers.forEach(clearTimeout);
  timers = [];
  document.querySelectorAll("li.playing").forEach((li) => li.classList.remove("playing"));
  $("speak").disabled = false;
  $("stop").disabled = true;
}

async function init() {
  for (const s of SAMPLES) {
    const b = document.createElement("button");
    b.textContent = s;
    b.onclick = () => { $("text").value = s; };
    $("samples").appendChild(b);
  }
  const opts = await (await fetch("/api/options")).json();
  for (const v of opts.voices) $("voice").appendChild(new Option(v, v));
  sampleRate = opts.sample_rate;
  const d = opts.defaults;
  $("voice").value = d.voice;
  $("speed").value = d.speed;
  $("steps").value = d.steps;
  syncLabels();
  for (const id of ["voice", "speed", "steps"]) $(id).addEventListener("input", syncLabels);
  $("speak").onclick = speak;
  $("stop").onclick = () => { stop(); setStatus("Stopped."); };
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) speak(); });
  setStatus("Ready. ⌘/Ctrl+Enter to speak. The first request loads the model, so it takes longer.");
}

init().catch((e) => setStatus(`Couldn't load options: ${e.message}`, true));
</script>
</body>
</html>
