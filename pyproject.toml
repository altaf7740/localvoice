[project]
name = "localvoice"
version = "0.1.0"
description = "Fully local Hinglish text-to-speech: select text, tap a key, hear it"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ===========================================================================
    # CORE  (src/main.py, src/core/, src/shared/)
    # ===========================================================================
    "numpy>=2.0",                   # Audio buffers (mistral-common caps it below 2.4)
    "sounddevice>=0.5.6",           # Speaker playback (src/shared/audio.py)
    "pynput>=1.8.2",                # Global hotkey + Ctrl+C on Windows/Linux (src/core/reader.py)
    "requests>=2.34.2",             # Ollama HTTP API (src/modules/transliterate/)
    # ===========================================================================
    # Apple Silicon  (src/modules/tts/)
    # ===========================================================================
    # pinned: src/modules/tts/voxcpm2.py re-implements VoxCPM2's generation loop on mlx-audio internals
    "mlx-audio==0.5.9; sys_platform == 'darwin' and platform_machine == 'arm64'",        # VoxCPM2, Voxtral, Kokoro on Apple GPU
    "mistral-common[audio]>=1.12.0; sys_platform == 'darwin' and platform_machine == 'arm64'",  # Voxtral tokenizer
    "misaki>=0.9.4; sys_platform == 'darwin' and platform_machine == 'arm64'",           # Kokoro G2P
    "espeakng-loader>=0.2.4; sys_platform == 'darwin' and platform_machine == 'arm64'",  # Bundled espeak-ng (Hindi G2P)
    "phonemizer-fork>=3.3.2; sys_platform == 'darwin' and platform_machine == 'arm64'",  # espeak-ng bindings
    # ===========================================================================
    # macOS  (src/modules/ui/menubar.py, src/shared/selection.py)
    # ===========================================================================
    "pyobjc-framework-cocoa>=12.2.2; sys_platform == 'darwin'",   # Clipboard
    "pyobjc-framework-quartz>=12.2.2; sys_platform == 'darwin'",  # ⌘C key events
    "rumps>=0.4.0; sys_platform == 'darwin'",                     # Menu-bar app
    # ===========================================================================
    # Windows, Linux, Intel Macs  (src/modules/ui/tray.py, src/modules/tts/)
    # ===========================================================================
    "kokoro>=0.9.4; sys_platform != 'darwin' or platform_machine != 'arm64'",  # Kokoro on CUDA/CPU (PyTorch)
    "pillow>=10.0; sys_platform != 'darwin'",                                  # Tray icons
    "pyperclip>=1.9; sys_platform != 'darwin'",                                # Clipboard
    "pystray>=0.19.5; sys_platform != 'darwin'",                               # System tray
]

[dependency-groups]
dev = [
    # Testing (src/tests/)
    "pytest>=8.0.0",
    # Code Quality
    "ruff>=0.12.2",
]
eval = [
    # Whisper round-trip intelligibility check (scripts/run_eval.py)
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
indent-width = 4
line-length = 120
include = ["src/**/*.py", "scripts/**/*.py"]
cache-dir = ".ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
fixable = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
# src/ is a namespace package (no __init__.py), so the project root must be on
# sys.path for "from src.…" imports to resolve.
pythonpath = ["."]
